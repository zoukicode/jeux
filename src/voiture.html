<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voiture</title>
  <link href="../output.css" rel="stylesheet" />
</head>
<style>
    .box::after{
        content: ''; display: block;
        background-color:black;height: 10px;width: 100%;
    }
    .box{
        transition: ease-in-out 1s;
        position: relative;width: 100%;background-color: gray;
    }section{margin: auto;}
    .lettre{color: white;}
    option{
        color: black;
    }
    .voiture{position: relative;top:20px;left: 2px;}
    section{background-color: blue;padding: 20px;display: grid;gap:20px;}
    p{
        color: yellow;text-align: center; font: bold;font-size: 20px;
    }
</style>
<body>
    <section>
    <!-- zoue de text -->
     <div>
       <div class=" lettre"><label for="level">level</label> <select  name="" id="level">
        <option value="Normale">Normale</option>
        <option value="Moyen">Moyen</option>
        <option value="Rapide">Rapide</option>
    </select></div>
        <p class="text-yellow-500 text-center font-bold text-xl">Clicker sur Entre pour commencer</p>
     </div>
    
    <div>
        <!-- Première voiture -->
    <div class="box">
        <svg class="voiture" width="300" height="150" xmlns="http://www.w3.org/2000/svg">
          <rect x="50" y="60" width="200" height="50" fill="#2196F3" />
          <polygon points="90,60 120,30 180,30 210,60" fill="#1976D2" />
          <circle cx="80" cy="115" r="15" fill="#212121" />
          <circle cx="220" cy="115" r="15" fill="#212121" />
          <rect x="125" y="35" width="20" height="25" fill="#BBDEFB" />
          <rect x="155" y="35" width="20" height="25" fill="#BBDEFB" />
        </svg>
      </div>

    <!-- Deuxième voiture -->
    <div class="box">
      <svg class="voiture" width="300" height="150" xmlns="http://www.w3.org/2000/svg">
        <rect x="50" y="60" width="200" height="50" fill="yellow" />
        <polygon points="90,60 120,30 180,30 210,60" fill="#1976D2" />
        <circle cx="80" cy="115" r="15" fill="#212121" />
        <circle cx="220" cy="115" r="15" fill="#212121" />
        <rect x="125" y="35" width="20" height="25" fill="#BBDEFB" />
        <rect x="155" y="35" width="20" height="25" fill="#BBDEFB" />
      </svg>
    </div>

    </div>
  </section>
</body>
<script type="module" src="voiture.js"></script>
</html>
